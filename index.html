<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KLAW</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#fff;font-family:Arial Black,sans-serif;overflow-x:hidden}
.header{position:fixed;top:0;left:0;width:100%;height:58px;padding:0 14px;display:flex;justify-content:space-between;align-items:center;z-index:100;background:rgba(5,5,8,0.9);backdrop-filter:blur(10px);border-bottom:1px solid #111}
.logo{color:#FF0A0A;font-weight:900;font-size:30px;letter-spacing:-1.5px;transform:rotate(-2deg)}
.btns{display:flex;gap:6px}
.b{padding:8px 14px;border-radius:100px;font-size:11px;font-weight:900;letter-spacing:.5px;border:1.5px solid #222;background:#0A0A0F;color:#fff}
.b.lime{border-color:#D9FF00;color:#D9FF00}
.b.fill{background:#D9FF00;color:#000;border-color:#D9FF00}
.hero-wrap{padding-top:58px;min-height:100vh;background:#050508;position:relative}
.top-title{text-align:center;padding-top:18vh}
.t{font-size:92px;color:#FF0A0A;font-weight:900;letter-spacing:-3px;line-height:.9;transform:rotate(-1deg)}
/* STAGE LANGSUNG DI BAWAH JUDUL - SESUAI PANAH HIJAU LU */
.stage{height:250vh;position:relative;margin-top:2vh}
.sticky{position:sticky;top:58px;height:calc(100vh - 58px);overflow:hidden}
.stars{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.6) 1px, transparent 1.5px);background-size:90px 90px;opacity:.18}
.water{position:absolute;bottom:0;left:0;width:100%;height:46%;background:linear-gradient(to bottom, #121828 0%, #080A12 60%, #020205 100%);border-top:1px solid #1A1F2E;z-index:2}
.lob-wrap{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:620px;max-width:100vw;height:88%;display:flex;align-items:flex-end;justify-content:center;z-index:3;pointer-events:none}
.lob{width:100%;height:auto;max-height:100%;object-fit:contain;transform:translateY(65%);will-change:transform;filter:drop-shadow(0 -10px 60px rgba(255,10,10,.5))}
</style>
</head>
<body>
<div class="header">
<div class="logo">klaw</div>
<div class="btns">
<div class="b lime">PFP</div><div class="b">JOIN</div>
<a href="https://app.torchpad.fun/trade/robinhood/0x7699c5e009a90d64b23c6d707b9714f164f91111" target="_blank" class="b fill" style="text-decoration:none">BUY $KLAW</a>
</div>
</div>

<div class="hero-wrap">
<div class="top-title"><div class="t">klaw</div></div>

<!-- ANIMASI TARO SINI - PAS DI PANAH HIJAU LU -->
<div class="stage" id="stage">
<div class="sticky">
<div class="stars"></div>
<div class="water"></div>
<div class="lob-wrap"><img class="lob" id="lob" src="https://iili.io/ns7pnfV.jpg"></div>
</div>
</div>
</div>

<div style="padding:80px 20px;background:#050508;border-top:1px solid #111;text-align:center">
<p style="font-family:monospace;color:#555;font-size:11px;letter-spacing:2px">KLAW 4 PHASE EMERGENCE</p>
</div>

<script>
const stage=document.getElementById('stage');
const lob=document.getElementById('lob');
// 4 FOTO LU SESUAI URUTAN
const imgs=[
"https://iili.io/ns7pnfV.jpg", // 2 / animasi utama
"https://iili.io/nsY90AX.jpg", // 1
"https://iili.io/nsYJoQa.jpg",  // 3
"https://iili.io/nsYdaSV.jpg"   // 4
];
let ticking=false;
function onScroll(){
const rect=stage.getBoundingClientRect();
const progress=Math.min(Math.max(-rect.top / (rect.height - window.innerHeight), 0), 1);
// persis lobin: dari 65% ketutup ke -8% naik
lob.style.transform=`translateY(${65 - progress*78}%) scale(${0.85 + progress*0.2})`;
// ganti foto pas scroll
if(progress < 0.3) lob.src=imgs[0];
else if(progress < 0.6) lob.src=imgs[1];
else if(progress < 0.85) lob.src=imgs[2];
else lob.src=imgs[3];
ticking=false;
}
window.addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(onScroll);ticking=true;}}, {passive:true});
onScroll();
</script>
</body>
</html>
